name: mobile
description: "ScamPlay - Bilingual Digital Safety Education Mobile App"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  drift: ^2.24.2
  drift_flutter: ^0.2.4
  path_provider: ^2.1.5
  path: ^1.9.0
  http: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.24.2
  build_runner: ^2.4.15

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/

  fonts:
    - family: KantumruyPro
      fonts:
        - asset: assets/fonts/KantumruyPro-Variable.ttf

    - family: Battambang
      fonts:
        - asset: assets/fonts/Battambang-Regular.ttf
          weight: 400
        - asset: assets/fonts/Battambang-Bold.ttf
          weight: 700

    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
